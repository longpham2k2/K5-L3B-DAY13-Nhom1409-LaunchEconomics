# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Kết quả D1 và tỉ lệ mở lại được tính bằng src/lab13.py.
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm để phát hiện chênh lệch 5 điểm phần trăm.
#   b) Theo nhân viên, m = 75: DE = 2,48; cần 3.103 yêu cầu và 42 người mỗi nhóm, tổng 84 > 40.
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng luôn dưới 20 ÷ 0,02 = 1.000, thấp hơn 1.251.
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng luôn dưới 6 ÷ 0,02 = 300, thấp hơn 1.251.
#   e) Chênh lệch 6 điểm phần trăm: cần 859 yêu cầu hiệu dụng mỗi nhóm. Với 20 người mỗi nhóm, cần ít nhất 299 yêu cầu/người (DE = 6,96; 5.980 yêu cầu thực tế mỗi nhóm).
#
# D2 · Năm câu kiểm tra tách được tác động
#   1. Có đối chứng cùng thời gian. Hai nhóm làm trong cùng thời kỳ và phân bổ cân bằng theo depot.
#   2. Chia ngẫu nhiên theo nhân viên, phân tầng theo depot, dùng seed 1409 và lưu danh sách trước khi bật trợ lý.
#   3. Rủi ro chia sẻ gợi ý cùng depot. Giới hạn quyền theo tài khoản, theo dõi lượt mở theo staff_id và giữ yêu cầu ở nhóm được phân ban đầu.
#   4. Chốt trước ngày bắt đầu: chỉ số chính, ngưỡng, luật dừng và ngày quyết định 12/01/2027.
#   5. Có 20 cụm mỗi nhóm, mỗi nhân viên là một cụm.
#
# Đánh đổi: Chia theo nhân viên để giảm ảnh hưởng gián tiếp so với chia theo yêu cầu. Power của kiểm định khác biệt bằng 0 là 80% nếu hiệu quả thật là 6 điểm phần trăm và khoảng 64% nếu hiệu quả thật là 5 điểm.
#
# Mở lại trong 7 ngày trên dữ liệu lab: 51/1.200 = 4,25% toàn mẫu và 39/982 = 3,97% trong phạm vi pilot.
# Ngưỡng an toàn: cao hơn đối chứng từ 2 điểm phần trăm hoặc vượt trần 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: >-
    Chỉ nhận noi_dia và hang_nang; loại quoc_te và doi_tac khỏi pilot.
    Hai loại được chọn có chi phí mỗi việc thành công lần lượt bằng 0,22× và 0,69×
    mốc nhân viên tự làm 12.000 đ [simulated]. Dự kiến thực hiện tại 12 depot,
    với 20 nhân viên dùng trợ lý và 20 nhân viên đối chứng.
    Chỉ bắt đầu sau khi Giám đốc vận hành xác nhận đủ nhân viên, khả năng thu mẫu
    và ghi nhận event có trace_id; dữ liệu chạy thử ban đầu chỉ có tại D01-D06.
  start_date: "2026-11-30"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
    stratify_by: "depot"
    seed: 1409
  rollout: [0.10, 0.25, 0.50]    # 4 -> 10 -> 20 nhân viên dùng trợ lý, trên tổng 40 nhân viên
  rollout_schedule: >-
    Hai bước đầu dự kiến mỗi bước một tuần; nếu chưa đủ dữ liệu theo dõi hoặc
    chưa đạt điều kiện an toàn thì giữ nguyên bước và rà soát lại hằng ngày.
    Chọn trước 4 rồi 10 người trong nhóm 20 nhân viên dùng trợ lý;
    giữ nguyên nhóm 20 nhân viên đối chứng trong suốt pilot.
    Nhân viên thuộc nhóm dùng trợ lý nhưng chưa được dùng ở bước đầu không tính vào nhóm đối chứng.
    Giám đốc vận hành chỉ cho chuyển bước khi không còn luật dừng đang kích hoạt,
    có dữ liệu mở lại đã theo dõi đủ 7 ngày của cả hai nhóm, tỉ lệ mở lại không vượt trần 6%
    và không cao hơn đối chứng từ 2 điểm phần trăm, các điều kiện khắc phục đã hoàn thành.
    Không ấn định ngày chuyển sang bước 50% khi chưa đạt các điều kiện này.
    Chỉ thu mẫu đánh giá chỉ số chính từ bước 50%, cùng thời gian ở hai nhóm,
    đến hết ngày 03/01/2027. Chờ đủ thời gian theo dõi trước ngày quyết định 12/01/2027;
    nếu không đạt cỡ mẫu thì ghi chưa đủ bằng chứng, không mở rộng pilot.
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859                 # cỡ mẫu hiệu dụng mỗi nhóm theo D1e
    n_requests_per_arm: 5980       # 20 nhân viên x 299 yêu cầu thực tế mỗi nhóm
    design_effect: 6.96
    clusters_per_arm: 20
    analysis: >-
      Lấy 299 yêu cầu noi_dia hoặc hang_nang đầu tiên được giao cho mỗi nhân viên
      từ bước 50%, theo nhóm đã chia ngẫu nhiên; không chỉ lấy yêu cầu thành công
      hoặc yêu cầu nhân viên thực sự dùng gợi ý. Ghi nhận khi chuyển người xử lý,
      giữ nhóm được phân ban đầu khi phân tích.
      Chỉ chốt kết quả khi đã xác định đóng trong 24 giờ và theo dõi mở lại đủ 7 ngày,
      theo cùng định nghĩa của dong_trong_24h và mo_lai_trong_7_ngay ở cả hai nhóm.
      Thiếu dữ liệu không được coi là thành công hoặc không mở lại.
      So sánh tỉ lệ giữa hai nhóm, điều chỉnh theo depot và theo cụm nhân viên;
      chốt phương pháp phân tích trước ngày bắt đầu, báo cáo chênh lệch và khoảng tin cậy 95%.
  identifiability:
    concurrent_control: >-
      20 nhân viên đối chứng tự xử lý yêu cầu, không dùng trợ lý,
      làm cùng thời gian và trong cùng phạm vi noi_dia, hang_nang với nhóm dùng trợ lý.
    spillover_risk: >-
      Có nguy cơ nhân viên chia sẻ câu trả lời trong cùng depot.
      Chỉ cấp quyền dùng trợ lý cho nhân viên được chọn ở bước hiện tại,
      hướng dẫn không chia sẻ gợi ý cho nhóm đối chứng và ghi lượt mở trợ lý theo staff_id.
      Ghi nhận các trường hợp nhóm đối chứng tiếp cận gợi ý để báo cáo hạn chế khi phân tích.
    predeclared: >-
      Trước khi bắt đầu, chốt danh sách nhân viên và depot, chia ngẫu nhiên với seed 1409,
      chỉ số chính, cỡ mẫu, cách tính chỉ số, ngưỡng, luật dừng và ngày quyết định.
      Chấp nhận thiết kế phát hiện mức chênh 6 điểm thay cho mục tiêu thiết kế ban đầu 5 điểm;
      nếu tác động thật chỉ 5 điểm thì power khoảng 0,64 theo tính toán của lab.
  monitoring:
    safety: >-
      Kiểm tra mở lại hằng ngày trên yêu cầu của bước hiện tại đã theo dõi đủ 7 ngày,
      dùng cùng khoảng thời gian tạo yêu cầu cho cả hai nhóm và ghi rõ tử số, mẫu số.
      Tỉ lệ bằng số yêu cầu có mo_lai_trong_7_ngay = 1 chia số yêu cầu đã có kết quả đầy đủ.
      Chưa có dữ liệu, thiếu kết quả hoặc mẫu số bằng 0 thì chưa kết luận đạt an toàn
      và không chuyển bước. Hoàn trùng được kiểm tra ngay khi phát hiện, không chờ đủ 7 ngày.
    cost: >-
      Tính chi phí mỗi việc thành công như A2: cộng token và tool của mọi lần chạy,
      tiền nhân viên xem lại và làm lại, rồi chia số yêu cầu có ket_qua = thanh_cong.
      Trong pilot, dùng phút đo thực tế và đơn giá giả định 2.000 đ/phút.
      Chia theo các tuần 7 ngày liên tiếp kể từ khi bắt đầu, chỉ chốt khi các yêu cầu
      của tuần đó đã đủ thời gian theo dõi và có kết quả đầy đủ.
      Có chi phí nhưng không có việc thành công thì coi là vượt ngưỡng;
      thiếu dữ liệu thì không chuyển bước, không coi chi phí bằng 0.
      Chỉ số này chưa gồm chi phí cố định và chi phí nhân viên xử lý yêu cầu không thành công.
      Ngưỡng 8.000 đ áp dụng trong cả pilot; nếu xem lại 100% kéo dài, B4 cho thấy
      có thể vượt ngưỡng [simulated], khi đó phải thực hiện luật chi phí,
      không tự giảm xem lại khi chưa đạt an toàn.
    usage: >-
      Tỉ lệ bỏ qua gợi ý bằng số yêu cầu được xem lại có quyet_dinh_xem_lai là sua hoặc bo
      chia số yêu cầu có duoc_xem_lai = 1, thống nhất với chi_so.md.
      Tính theo từng tuần 7 ngày kể từ khi bắt đầu, mỗi yêu cầu tính một lần.
      Không có yêu cầu được xem lại thì ghi chưa có dữ liệu, không gán tỉ lệ bằng 0.
  stop_rules:
    - >-
      NẾU tỉ lệ mở lại trong 7 ngày của nhóm dùng trợ lý cao hơn nhóm đối chứng
      ít nhất 2 điểm phần trăm hoặc vượt 6%
      TRONG 3 ngày kiểm tra liên tiếp trên yêu cầu đã đủ thời gian theo dõi
      THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và giao Trưởng nhóm CSKH rà soát nguyên nhân
      KHÔNG THÌ không được chuyển bước rollout hoặc bật lại trợ lý khi chưa khắc phục
      và chưa được Giám đốc vận hành phê duyệt.
    - >-
      NẾU phát hiện ít nhất 1 ca hoàn trùng
      TRONG bất kỳ thời điểm nào của pilot
      THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và giao Kế toán trưởng đối soát sổ cái,
      Kỹ sư trưởng agent kiểm tra khóa chống trùng
      KHÔNG THÌ không được tiếp tục hoàn phí bằng trợ lý cho tới khi đối soát xong,
      khắc phục nguyên nhân và được Giám đốc vận hành phê duyệt.
    - >-
      NẾU chi phí mỗi việc thành công vượt 8.000 đ
      TRONG 2 tuần liên tiếp đã có kết quả đầy đủ theo cách tính ở monitoring.cost
      THÌ PM trợ lý hoàn phí dừng chuyển bước và trình Giám đốc vận hành
      phương án thu hẹp về noi_dia, giới hạn 2 lần chạy trong 3 ngày
      KHÔNG THÌ không được tiếp tục mở hang_nang hoặc tăng rollout khi phương án chưa được phê duyệt.
      Nếu thực hiện thay đổi phạm vi hoặc số lần chạy, dừng đánh giá theo thiết kế cũ,
      chốt kế hoạch mới trước khi tiếp tục; không gộp mẫu trước và sau thay đổi để kết luận hiệu quả.
    - >-
      NẾU tỉ lệ bỏ qua gợi ý, tức sua hoặc bo trên số yêu cầu được xem lại, vượt 40%
      TRONG 1 tuần
      THÌ Trưởng nhóm CSKH giữ nguyên bước rollout, phỏng vấn 5 nhân viên
      và đề xuất cách khắc phục trong 3 ngày
      KHÔNG THÌ không được chuyển bước rollout khi chưa hoàn thành rà soát,
      chưa được Giám đốc vận hành duyệt cách khắc phục và chưa có một tuần theo dõi tiếp theo
      có dữ liệu cho thấy tỉ lệ bỏ qua không còn vượt 40%.
  interim_looks: >-
    Chỉ kiểm tra chỉ số an toàn giữa kỳ để bảo vệ khách hàng;
    không kiểm định chỉ số chính trước ngày quyết định.
    Chi phí và mức độ sử dụng vẫn được theo dõi theo các luật dừng đã viết trước,
    không dùng để thay đổi chỉ số chính hoặc chọn lại mẫu đánh giá.
  rollback: >-
    Giám đốc vận hành bấm cờ tắt trợ lý, có hiệu lực trong 30 phút kể từ khi luật an toàn kích hoạt.
    Kỹ sư trưởng agent bảo đảm không tạo thêm lệnh hoàn tự động;
    Kế toán trưởng đối soát các lệnh đã gửi trước khi nhân viên xử lý tiếp để tránh hoàn trùng.
    Khách được phục vụ bằng luồng nhân viên tự làm, kèm tóm tắt và trạng thái xử lý.
    Chỉ bật lại sau khi đã khắc phục nguyên nhân, kiểm tra an toàn và được Giám đốc vận hành phê duyệt.
  decision_date: "2027-01-12"
  decision_rule: >-
    Giám đốc vận hành xem xét đề xuất Go, Go có điều kiện hoặc No-go tại ngày quyết định.
    Chỉ đề xuất mở rộng pilot nếu đủ 20 cụm mỗi nhóm, mỗi nhân viên có 299 yêu cầu
    đã theo dõi đủ thời gian và có kết quả đầy đủ, mức tăng chỉ số chính ước tính
    ít nhất 5 điểm phần trăm so với đối chứng theo mục tiêu đề bài,
    kiểm định hai phía có p < 0,05 và không còn vi phạm các ngưỡng an toàn, chi phí, mức độ sử dụng.
    MDE 6 điểm là đánh đổi để tính cỡ mẫu; không có nghĩa đổi mục tiêu kinh doanh từ 5 thành 6 điểm.
    Power 80% là xấp xỉ cho kiểm định khác biệt so với 0 nếu tác động thật là 6 điểm,
    không phải xác suất đạt toàn bộ điều kiện mở rộng.
    Báo cáo thêm chi phí cả hệ thống, gồm nhân viên xử lý yêu cầu không thành công,
    và chi phí cố định 40 triệu đ/tháng theo khối lượng thực tế trước khi so với 12.000 đ/yêu cầu tự làm.
    Thiếu mẫu, thiếu dữ liệu hoặc thay phạm vi hay số lần chạy thì ghi chưa đủ bằng chứng,
    không mở rộng và không gộp mẫu khác thiết kế.
    Đủ mẫu nhưng không đạt hiệu quả hoặc lợi ích kinh tế thì không đề xuất mở rộng;
    vi phạm an toàn chưa khắc phục thì tiếp tục tắt trợ lý.
  simulated_inputs:
    - "A3: noi_dia 0,22× và hang_nang 0,69× so với 12.000 đ/việc thành công [simulated]."
    - "B4: xem lại 100% có chi phí 11.743-12.415 đ/việc thành công [simulated]; cần thay phút simulated bằng phút đo thực tế trong pilot."
    - "Dữ liệu lab giả lập: mở lại 51/1.200 = 4,25% toàn mẫu; 39/982 = 3,97% trong noi_dia và hang_nang."
    - "Giả định của lab: baseline 0,70, ICC 0,02, 40 nhân viên, 12 depot, 2.000 đ/phút, nhân viên tự làm 12.000 đ/yêu cầu và cố định 40 triệu đ/tháng."
    - "Mục tiêu đề bài: cải thiện ít nhất 5 điểm phần trăm; đánh đổi thiết kế: MDE 6 điểm, power khoảng 0,64 nếu tác động thật chỉ 5 điểm."
    - "Các ngưỡng 8.000 đ, 40%, chênh 2 điểm, trần 6% và thời hạn trong luật dừng là lựa chọn kế hoạch theo hướng dẫn lab, không phải kết quả đo."
